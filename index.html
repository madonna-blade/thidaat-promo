<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9mice — THIDAAT | Новый Альбом</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            letter-spacing: 1px;
            padding: 40px 20px;
        }

        .background-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 2;
            padding: 20px;
            max-width: 800px;
            width: 100%;
        }

        .artist {
            font-size: 1.5rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 10px;
            font-weight: 300;
            animation: fadeIn 1.5s ease-out;
        }

        .album-title {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 4px;
            background: linear-gradient(180deg, #fff 0%, #333 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            animation: scaleUp 1s ease-out;
        }

        .status {
            font-size: 1.1rem;
            color: #ff3333;
            text-transform: uppercase;
            margin-bottom: 40px;
            font-weight: 600;
            animation: fadeIn 2s ease-out;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 50px;
            animation: fadeIn 2.5s ease-out;
        }

        .time-block {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            min-width: 100px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .time-block:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 0, 0, 0.3);
        }

        .time-number {
            font-size: 3rem;
            font-weight: 700;
            display: block;
            margin-bottom: 5px;
        }

        .time-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #666;
        }

        .btn-action {
            display: inline-block;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            transition: all 0.3s ease;
            border: 2px solid #ffffff;
            box-shadow: 0 10px 20px rgba(255,255,255,0.05);
            cursor: pointer;
            margin-bottom: 60px;
        }

        .btn-action:hover {
            background: transparent;
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.2);
            border-color: #ff3333;
        }

        .socials-section {
            z-index: 2;
            margin-top: 20px;
            animation: fadeIn 3s ease-out;
        }

        .socials-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #444;
            letter-spacing: 3px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .socials-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .social-link {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.3s ease, letter-spacing 0.3s ease;
            padding: 5px 10px;
            border-bottom: 1px solid transparent;
        }

        .social-link:hover {
            color: #ffffff;
            border-color: #ff3333;
            letter-spacing: 2px;
        }

        .audio-player-status {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.8rem;
            color: #666;
            z-index: 10;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .playing-dot {
            width: 8px;
            height: 8px;
            background-color: #ff3333;
            border-radius: 50%;
            display: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        @media (max-width: 600px) {
            .album-title { font-size: 3rem; }
            .countdown { gap: 10px; }
            .time-block { padding: 15px 10px; min-width: 70px; }
            .time-number { font-size: 1.8rem; }
            .time-label { font-size: 0.6rem; }
            .audio-player-status { top: auto; bottom: 20px; right: auto; left: 50%; transform: translateX(-50%); }
            .socials-links { gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <!-- Индикатор аудио плеера -->
    <div class="audio-player-status">
        <div class="playing-dot" id="music-dot"></div>
        <span id="player-text">Трек: 9mice — No Fear (Пауза)</span>
    </div>

    <!-- Аудио плеер (Скрытый) -->
    <audio id="bg-audio" loop>
        <!-- Замените данный URL на прямую ссылку на .mp3 файл трека No Fear -->
        <source src="https://soundhelix.com" type="audio/mpeg">
        Ваш браузер не поддерживает аудио тег.
    </audio>

    <div class="container">
        <div class="artist">9mice</div>
        <h1 class="album-title">THIDAAT</h1>
        <div class="status" id="status-text">До релиза нового альбома осталось:</div>

        <div class="countdown" id="countdown">
            <div class="time-block">
                <span class="time-number" id="days">00</span>
                <span class="time-label">Дней</span>
            </div>
            <div class="time-block">
                <span class="time-number" id="hours">00</span>
                <span class="time-label">Часов</span>
            </div>
            <div class="time-block">
                <span class="time-number" id="minutes">00</span>
                <span class="time-label">Минут</span>
            </div>
            <div class="time-block">
                <span class="time-number" id="seconds">00</span>
                <span class="time-label">Секунд</span>
            </div>
        </div>

        <button class="btn-action" id="action-btn" onclick="toggleMusic()">Включить No Fear / Pre-Save</button>

        <!-- Раздел соцсетей -->
        <div class="socials-section">
            <div class="socials-title">Connect / Соцсети</div>
            <div class="socials-links">
                <a href="https://t.me" target="_blank" class="social-link">Telegram</a>
                <a href="https://instagram.com" target="_blank" class="social-link">Instagram</a>
                <a href="https://vk.ru" target="_blank" class="social-link">ВКонтакте</a>
            </div>
        </div>
    </div>

    <script>
        // Дата релиза: 13 ноября 2026 года 00:00:00
        const targetDate = new Date("November 13, 2026 00:00:00").getTime();

        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (difference < 0) {
                clearInterval(countdownInterval);
                document.getElementById("countdown").style.display = "none";
                document.getElementById("status-text").innerText = "Альбом уже доступен!";
                document.getElementById("status-text").style.color = "#00ff00";
            }
        }, 1000);

        // Управление проигрыванием
        const audio = document.getElementById("bg-audio");
        const playerText = document.getElementById("player-text");
